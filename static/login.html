<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Messenger Automation</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; }
  main { max-width: 420px; margin: 15vh auto; padding: 24px; }
  label, input, button { display: block; width: 100%; box-sizing: border-box; }
  input, button { font: inherit; padding: 12px; margin-top: 12px; border-radius: 8px; }
  button { background: #2563eb; color: white; border: 0; cursor: pointer; }
  #error { color: #fca5a5; }
</style>
<main>
  <h1>Messenger Automation</h1>
  <p>Enter your dashboard access token to continue.</p>
  <form id="login">
    <label for="token">Access token</label>
    <input id="token" type="password" required autocomplete="current-password" autofocus>
    <button>Sign in</button>
    <p id="error" role="alert"></p>
  </form>
</main>
<script>
  document.getElementById('login').addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = document.getElementById('error');
    error.textContent = '';
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('token').value }),
      });
      if (response.ok) location.replace('/');
      else error.textContent = 'Access token was not accepted.';
    } catch (_) { error.textContent = 'Unable to connect. Please try again.'; }
  });
</script>
</html>

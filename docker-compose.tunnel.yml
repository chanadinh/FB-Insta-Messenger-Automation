services:
  app:
    environment:
      # Published dashboards stay closed until private links or a password exist.
      REQUIRE_DASHBOARD_AUTH: "1"
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN before starting the tunnel}
    depends_on:
      - app
    restart: unless-stopped

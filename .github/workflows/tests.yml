name: Regression tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -v
        env:
          APP_DATA_DIR: ${{ runner.temp }}/fb-automation-tests
